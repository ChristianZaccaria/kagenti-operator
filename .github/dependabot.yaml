version: 2
updates:
# Maintain dependencies for GitHub Actions
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "daily"

# Go modules
- package-ecosystem: "gomod"
  directory: "/kagenti-operator"
  schedule:
    interval: "weekly"

# Docker base images
- package-ecosystem: "docker"
  directory: "/kagenti-operator"
  schedule:
    interval: "weekly"

- package-ecosystem: "docker"
  directory: "/kagenti-operator/cmd/agentcard-signer"
  schedule:
    interval: "weekly"
